components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        region:
          type: string
          format: uuid
          nullable: true
          title: Viloyat
        district:
          type: string
          format: uuid
          nullable: true
          title: Tuman
        regionName:
          type: string
          readOnly: true
        districtName:
          type: string
          readOnly: true
        address_text:
          type: string
          title: To‘liq manzil
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Kenglik
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Uzunlik
        is_default:
          type: boolean
          title: Asosiy manzil
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_text
      - created_at
      - districtName
      - id
      - regionName
    AddressRequest:
      type: object
      properties:
        region:
          type: string
          format: uuid
          nullable: true
          title: Viloyat
        district:
          type: string
          format: uuid
          nullable: true
          title: Tuman
        address_text:
          type: string
          minLength: 1
          title: To‘liq manzil
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Kenglik
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Uzunlik
        is_default:
          type: boolean
          title: Asosiy manzil
      required:
      - address_text
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orderNumber:
          type: string
        requestId:
          type: string
          readOnly: true
        quoteId:
          type: string
          readOnly: true
          nullable: true
        customerId:
          type: string
          readOnly: true
        customerName:
          type: string
          readOnly: true
        customerPhone:
          type: string
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/Provider'
          readOnly: true
        serviceName:
          type: string
        totalPrice:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        statusText:
          type: string
        scheduledTime:
          type: string
        estimatedArrival:
          type: string
        estimatedMinutesLeft:
          type: integer
        vehicle:
          type: string
          readOnly: true
        destinationAddress:
          type: string
        distanceKm:
          type: number
          format: double
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/BookingTimelineStep'
          readOnly: true
        paymentMethod:
          type: string
        isPaid:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - customerId
      - customerName
      - customerPhone
      - destinationAddress
      - distanceKm
      - estimatedArrival
      - estimatedMinutesLeft
      - id
      - isPaid
      - orderNumber
      - paymentMethod
      - provider
      - quoteId
      - requestId
      - scheduledTime
      - serviceName
      - statusText
      - timeline
      - totalPrice
      - vehicle
    BookingRequest:
      type: object
      properties:
        orderNumber:
          type: string
          minLength: 1
        serviceName:
          type: string
          minLength: 1
        totalPrice:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        statusText:
          type: string
          minLength: 1
        scheduledTime:
          type: string
          minLength: 1
        estimatedArrival:
          type: string
          minLength: 1
        estimatedMinutesLeft:
          type: integer
        destinationAddress:
          type: string
          minLength: 1
        distanceKm:
          type: number
          format: double
        paymentMethod:
          type: string
          minLength: 1
        isPaid:
          type: boolean
      required:
      - destinationAddress
      - distanceKm
      - estimatedArrival
      - estimatedMinutesLeft
      - isPaid
      - orderNumber
      - paymentMethod
      - scheduledTime
      - serviceName
      - statusText
      - totalPrice
    BookingTimelineStep:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
        subtitle:
          type: string
          maxLength: 200
        timestamp:
          type: string
        completed:
          type: boolean
        current:
          type: boolean
      required:
      - timestamp
      - title
